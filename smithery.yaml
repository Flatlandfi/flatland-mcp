# flatland MCP — legacy hosted-client manifest
# This starts flatland-client for existing API-key holders, not Desk's local connection.
# Connection guide: https://github.com/Flatlandfi/flatland-mcp#existing-api-key-holders
# Editing this file does not update an existing Smithery listing.

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apiKey
    properties:
      apiKey:
        type: string
        title: "Existing flatland API key"
        description: "For the legacy hosted connection only. See https://github.com/Flatlandfi/flatland-mcp#existing-api-key-holders."
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "flatland-client", "mcp"],
      env: {
        FLATLAND_API_KEY: config.apiKey
      }
    })
