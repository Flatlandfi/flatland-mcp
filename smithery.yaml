# Flatland MCP — Smithery registry manifest
# https://smithery.ai/servers/flatlandfi/flatland

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apiKey
    properties:
      apiKey:
        type: string
        title: "flatland API key"
        description: "Existing flatland API key; see https://flatlandfi.com/install for access and setup."
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "flatland-client", "mcp"],
      env: {
        FLATLAND_API_KEY: config.apiKey
      }
    })
